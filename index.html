<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F2136">
<title>Nemdroid</title>
<!-- Nemdroid v4.2 — grabadora. Este archivo es público (GitHub Pages): no contiene ni debe
     contener datos de pacientes. Los códigos y alias viven sólo en cada dispositivo. -->
<style>
  :root{--bg:#0F2136;--panel:#152D47;--accent:#5B9EC9;--ink:#E9F2F9;--muted:#7A93A8;--rec:#E25C6E;--warn:#C9A227;--note:#8FBF7A;
        --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{min-height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;min-height:100vh;
       padding:max(env(safe-area-inset-top),14px) 18px max(env(safe-area-inset-bottom),18px);user-select:none}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  header h1{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  header h1 span{font-size:10px;color:var(--muted);letter-spacing:0}
  header .st{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .aviso{border:1px solid var(--warn);color:#E6D59B;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:10px;line-height:1.5}
  .codes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .chip{border:1px solid #24415F;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:14px;
        padding:9px 14px;border-radius:9px;cursor:pointer}
  .chip .al{font-family:var(--sans);font-weight:700;margin-right:6px}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#0B1B2C}
  .chip.edit{color:var(--muted);border-style:dashed}
  .hint{font-size:12px;color:var(--muted);min-height:16px;margin-bottom:6px;line-height:1.5}
  body.rec .hint{color:var(--ink)}
  .panel{display:none;flex-direction:column;gap:8px;border:1px solid #24415F;border-radius:10px;padding:12px;margin-bottom:10px}
  .fld{background:var(--panel);border:1px solid #24415F;color:var(--ink);font-family:var(--mono);font-size:14px;
       padding:10px 12px;border-radius:8px;width:100%}
  .sub{font-size:11px;color:var(--muted);line-height:1.5}
  .rowl{display:flex;gap:8px;flex-wrap:wrap}
  .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1C3550}
  .item .c{font-family:var(--mono);font-size:14px;min-width:46px}
  .item .a{flex:1;font-weight:700;color:var(--accent);font-size:13px}
  .item .nv{font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 5px}
  .item button{background:none;border:none;color:var(--muted);font-size:13px;padding:4px 8px;cursor:pointer}
  .item button.del{color:var(--rec);font-size:16px}
  .card{border:1px solid var(--warn);border-radius:11px;padding:11px 12px;margin-bottom:10px;background:rgba(201,162,39,.07)}
  .card.vivo{border-color:var(--rec);background:rgba(226,92,110,.08)}
  .card.ok{border-color:#3C6B47;background:rgba(143,191,122,.06)}
  .card .ct{font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--warn);margin-bottom:4px}
  .card.vivo .ct{color:var(--rec)}
  .card.ok .ct{color:var(--note)}
  .card .cd{font-size:13px;line-height:1.55;margin-bottom:9px}
  .card .sub{margin-top:7px}
  .mono{font-family:var(--mono);font-size:11px;color:var(--muted);word-break:break-all}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:8px 0}
  .ringwrap{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
  svg.ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
  .lvl{fill:none;stroke:var(--accent);stroke-width:3;opacity:.9}
  .base{fill:none;stroke:#24415F;stroke-width:1.5}
  #recbtn{width:158px;height:158px;border-radius:50%;border:none;cursor:pointer;background:var(--panel);color:var(--ink);
          font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.06em;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 1px #24415F,0 10px 30px rgba(0,0,0,.35);text-align:center;padding:0 12px}
  #recbtn:disabled{opacity:.45;font-size:12px}
  #recbtn .dot{width:15px;height:15px;border-radius:50%;background:var(--rec)}
  body.rec #recbtn{background:var(--rec);color:#fff;box-shadow:0 0 0 1px var(--rec),0 10px 34px rgba(226,92,110,.35)}
  body.rec.nota #recbtn{background:var(--note);color:#0B1B2C}
  body.rec #recbtn .dot{background:#fff;animation:blink 1.2s infinite}
  body.rec .lvl{stroke:var(--rec)}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){body.rec #recbtn .dot{animation:none}}
  #timer{font-family:var(--mono);font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  body:not(.rec) #timer{color:var(--muted)}
  #parte{font-size:11px;color:var(--muted);min-height:14px;margin-top:-12px}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .row.l{justify-content:flex-start;gap:8px}
  .btn2{border:1px solid #24415F;background:transparent;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:13px;
        letter-spacing:.05em;padding:12px 20px;border-radius:11px;cursor:pointer}
  .btn2:disabled{opacity:.3}
  .btn2.sm{padding:9px 13px;font-size:12px}
  .btn2.stop{border-color:var(--accent);color:var(--accent)}
  .btn2.warn{border-color:var(--warn);color:var(--warn)}
  .btn2.note{border-color:var(--note);color:var(--note)}
  .btn2.del{border-color:transparent;color:var(--muted)}
  .btn2.rojo{border-color:var(--rec);color:var(--rec)}
  #ultimo{width:100%;max-width:420px}
  details.rec48{margin-top:6px;font-size:12px;color:var(--muted)}
  details.rec48 summary{cursor:pointer;padding:6px 0}
  .fila{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid #1C3550}
  .fila .t{flex:1;min-width:150px;color:var(--ink);font-size:12px;line-height:1.45}
  .fila button{background:none;border:1px solid #24415F;color:var(--muted);font-size:11px;padding:6px 9px;border-radius:8px;cursor:pointer}
  footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;min-height:34px;margin-top:12px}
  footer b{color:var(--accent);font-weight:600}
  .modal{position:fixed;inset:0;background:rgba(5,12,20,.84);display:none;align-items:center;justify-content:center;padding:16px;z-index:40}
  .modal .caja{background:var(--bg);border:1px solid #24415F;border-radius:14px;padding:16px;width:100%;max-width:440px;
               max-height:90vh;overflow-y:auto;display:flex;flex-direction:column;gap:11px}
  .mtit{font-weight:700;font-size:15px}
  #mtxt{font-size:13px;color:var(--ink);line-height:1.5}
  .mlist{max-height:42vh;overflow-y:auto}
  #negra{position:fixed;inset:0;background:#000;z-index:60;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px}
  #negratim{font-family:var(--mono);font-size:22px;color:#444;position:absolute}
  #negra .sub{color:#333;position:absolute;bottom:40px}
</style>
</head>
<body>
<header>
  <h1>Nemdroid <span>v4.2</span></h1>
  <span class="st" id="clock"></span>
</header>

<div id="tzwarn" class="aviso" style="display:none"></div>
<div id="dbwarn" class="aviso" style="display:none"></div>
<div id="pendientes"></div>

<div class="codes" id="codes"></div>
<div class="hint" id="hint"></div>

<div id="codepanel" class="panel">
  <div class="rowl">
    <button class="btn2" id="nuevo" style="border-color:#5B9EC9;color:#5B9EC9">+ NUEVO PACIENTE</button>
    <button class="btn2" id="cargar">ACTUALIZAR LISTA</button>
    <input type="file" id="archivo" accept=".txt,text/plain" style="display:none">
  </div>
  <div class="sub" id="listinfo"></div>
  <input id="codesearch" class="fld" placeholder="buscar código o alias…" style="font-family:var(--sans);font-size:13px">
  <div id="codelist" style="max-height:230px;overflow-y:auto"></div>
  <details class="sub"><summary>Agregar a mano un código que ya existe</summary>
    <div class="rowl" style="margin-top:6px"><input id="addexist" class="fld" placeholder="p012" style="flex:1">
    <button class="btn2" id="addbtn">AGREGAR</button></div></details>
  <div class="sub">Alias = iniciales, sólo en este dispositivo. Nunca nombres. · Dispositivo: <b id="devname"></b>
    <button class="btn2" id="devbtn" style="padding:3px 8px;font-size:11px">cambiar</button></div>
</div>

<div class="stage">
  <div class="ringwrap">
    <svg class="ring" viewBox="0 0 210 210"><circle class="base" cx="105" cy="105" r="98"/><circle class="lvl" id="lvl" cx="105" cy="105" r="84"/></svg>
    <button id="recbtn"><span class="dot"></span><span id="reclbl">GRABAR</span></button>
  </div>
  <div id="timer">00:00</div>
  <div id="parte"></div>
  <div class="row">
    <button class="btn2" id="pausebtn" disabled>Pausar</button>
    <button class="btn2 stop" id="stopbtn" disabled>Detener y guardar</button>
  </div>
  <div class="row">
    <button class="btn2 note" id="notabtn">SÓLO NOTA</button>
    <button class="btn2" id="negrabtn" style="display:none">🌙 Pantalla negra</button>
  </div>
  <div id="ultimo"></div>
</div>

<details class="rec48" id="rec48" style="display:none"><summary id="rec48s"></summary><div id="rec48l"></div></details>

<footer id="status">Cada grabación guarda <b>dos archivos</b> en Descargas (.webm y .json). Mové siempre los dos.</footer>

<div id="modal" class="modal"><div class="caja">
  <div class="mtit" id="mtit"></div><div id="mtxt"></div><div id="mpick"></div><div class="row l" id="mbot"></div>
</div></div>
<div id="negra"><div id="negratim">00:00</div><div class="sub">Sigue grabando · tocá dos veces para volver</div></div>

<script>
(() => {
  'use strict';
  const VERSION = '4.2';
  const BA = 'America/Argentina/Buenos_Aires';
  const K = { codes: 'nem_codes', lista: 'nem_lista', dev: 'nem_dispositivo', usados: 'nem_nombres', orden: 'nem_orden' };
  const CODE_RE = /^p\d{3}$/;
  const ALIAS_RE = /^[A-ZÁÉÍÓÚÑÜ]{1,4}$/;
  const RETENER_H = 48;        // horas que una grabación YA guardada queda también en el teléfono
  const MAX_GUARDADAS = 40;    // y como mucho tantas (las más viejas se borran del teléfono, nunca las sin guardar)
  const CONTINUAR_MIN = 45;    // minutos después de un corte en los que GRABAR pregunta si es la continuación
  const LOCK = 'nemdroid-rec-';
  const $ = id => document.getElementById(id);
  const status = html => { $('status').innerHTML = html; };
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  window.onerror = (m, s, l) => status('⚠ Error: ' + m + ' (línea ' + l + ')');
  window.addEventListener('unhandledrejection', e => status('⚠ Error: ' + ((e.reason && e.reason.message) || e.reason)));

  const leer = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; } catch (e) { return def; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const nav = (typeof navigator !== 'undefined' && navigator) || {};

  // ---------- códigos (sólo códigos y alias de iniciales; nunca nombres) ----------
  function normalizarCodigo(c) {
    const m = String(c || '').trim().toLowerCase().match(/^(?:p|pac)0*(\d{1,3})$/);
    return m ? 'p' + m[1].padStart(3, '0') : null;
  }
  function cargarCodigos() {
    const v = leer(K.codes, null);
    if (Array.isArray(v)) return v.filter(x => x && CODE_RE.test(x.c));
    const out = [];                                   // migración desde v3.3 (rbq_codes)
    for (const c of leer('rbq_codes', [])) {
      const n = normalizarCodigo(c);
      if (n && !out.some(x => x.c === n)) out.push({ c: n, alias: '', nuevo: false });
    }
    return out;
  }
  let codigos = cargarCodigos();
  let lista = leer(K.lista, { generado: null, siguiente: null, cargada: null });
  let orden = leer(K.orden, []);
  let dev = leer(K.dev, null);
  if (!dev || !dev.id) { dev = { id: 'dev-' + Math.random().toString(16).slice(2, 6), nombre: '' }; guardar(K.dev, dev); }
  const guardarCodigos = () => guardar(K.codes, codigos);
  const obj = c => codigos.find(x => x.c === c);
  let sel = null;

  function parsearLista(texto) {
    const res = { codes: [], siguiente: null, generado: null, ajenas: 0 };
    for (const raw of String(texto).split(/\r?\n/)) {
      const l = raw.trim();
      if (!l) continue;
      if (l.startsWith('#')) { const g = l.match(/generado:\s*(.+)$/i); if (g) res.generado = g[1].trim(); continue; }
      const s = l.match(/^siguiente:\s*(p\d{3})$/i);
      if (s) { res.siguiente = s[1].toLowerCase(); continue; }
      const c = normalizarCodigo(l);
      if (c) res.codes.push(c); else res.ajenas++;
    }
    return res;
  }
  function siguienteLibre() {
    let n = 0;
    for (const x of codigos) n = Math.max(n, parseInt(x.c.slice(1), 10));
    n += 1;
    if (lista.siguiente) n = Math.max(n, parseInt(lista.siguiente.slice(1), 10));
    return 'p' + String(n).padStart(3, '0');
  }
  function diasDesdeLista() {
    if (!lista.cargada) return null;
    return Math.floor((Date.now() - Date.parse(lista.cargada)) / 86400000);
  }
  function etiqueta(o) { return (o.alias ? '<span class="al">' + esc(o.alias) + '</span>' : '') + esc(o.c); }
  function quien(c) {
    if (!c) return 'sin paciente';
    const o = obj(c);
    return (o && o.alias ? esc(o.alias) + ' · ' : '') + esc(c);
  }
  function ordenados() {
    return [...codigos].sort((a, b) => {
      const ia = orden.indexOf(a.c), ib = orden.indexOf(b.c);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.c.localeCompare(b.c);
    });
  }
  function elegir(c) {
    sel = c;
    if (c) { orden = [c, ...orden.filter(x => x !== c)].slice(0, 200); guardar(K.orden, orden); }
    renderCodes(); pintarHint();
  }
  function pintarHint() {
    const a = actual;
    if (a) {
      $('hint').innerHTML = a.code
        ? '● Grabando para: <b>' + quien(a.code) + '</b> — si no es, tocá el correcto.'
        : '● Grabando <b>sin paciente</b>: lo elegís al detener (o tocá uno ahora).';
      return;
    }
    const o = sel && obj(sel);
    $('hint').innerHTML = sel
      ? 'Paciente: <b>' + quien(sel) + '</b>' + (o && o.nuevo ? ' (paciente nuevo)' : '')
      : 'Elegí el paciente, o grabá y elegilo al final.';
  }
  function renderCodes() {
    const box = $('codes'); box.innerHTML = '';
    const marcado = actual ? actual.code : sel;
    ordenados().slice(0, 12).forEach(o => {
      const b = document.createElement('button');
      b.className = 'chip' + (o.c === marcado ? ' sel' : '');
      b.innerHTML = etiqueta(o);
      b.onclick = () => tocarChip(o.c);
      box.appendChild(b);
    });
    const ed = document.createElement('button');
    ed.className = 'chip edit'; ed.textContent = '± pacientes';
    ed.onclick = togglePanel;
    box.appendChild(ed);
  }
  async function tocarChip(c) {
    const a = actual;
    if (!a) { elegir(c); return; }
    if (a.code === c) return;
    const r = await modal({ titulo: 'Cambiar el paciente de esta grabación',
      texto: '¿La grabación en curso es de <b>' + quien(c) + '</b>?' + (a.code ? '<br>(ahora dice ' + quien(a.code) + ')' : ''),
      botones: [{ t: 'SÍ, ES DE ' + c, v: 'si', cls: 'stop' }, { t: 'no', v: null }] });
    if (!r || actual !== a) return;
    await cambiarPaciente(a.cadena, c);
    elegir(c);
  }
  function togglePanel() {
    const p = $('codepanel');
    p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    renderLista();
  }
  function renderLista() {
    const d = diasDesdeLista();
    $('listinfo').textContent = d === null
      ? 'La lista de la PC todavía no se cargó en este dispositivo.'
      : 'Lista de la PC cargada hace ' + (d === 0 ? 'menos de un día' : d + ' día(s)') +
        (lista.siguiente ? ' · próximo código libre según la PC: ' + lista.siguiente : '');
    $('devname').textContent = dev.nombre || dev.id;
    const q = ($('codesearch').value || '').trim().toLowerCase();
    const box = $('codelist'); box.innerHTML = '';
    const filas = codigos.filter(o => !q || o.c.includes(q) || (o.alias || '').toLowerCase().includes(q))
                         .sort((a, b) => a.c.localeCompare(b.c));
    filas.forEach(o => {
      const row = document.createElement('div'); row.className = 'item';
      row.innerHTML = '<span class="c">' + esc(o.c) + '</span><span class="a">' + esc(o.alias || '') + '</span>' +
                      (o.nuevo ? '<span class="nv">nuevo</span>' : '');
      const al = document.createElement('button'); al.textContent = 'alias';
      al.onclick = () => { pedirAlias(o); renderCodes(); renderLista(); pintarHint(); };
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
      del.onclick = () => {
        if (!confirm('¿Sacar ' + o.c + ' de este dispositivo? (No borra nada en la PC.)')) return;
        codigos = codigos.filter(x => x.c !== o.c); if (sel === o.c) sel = null;
        guardarCodigos(); renderCodes(); renderLista(); pintarHint();
      };
      const pick = document.createElement('button'); pick.textContent = 'elegir';
      pick.onclick = () => { $('codepanel').style.display = 'none'; tocarChip(o.c); };
      row.append(al, pick, del); box.appendChild(row);
    });
    if (!filas.length) box.innerHTML = '<span class="sub">Sin pacientes. Tocá ACTUALIZAR LISTA o + NUEVO PACIENTE.</span>';
  }
  function pedirAlias(o) {
    const v = prompt('Alias para ' + o.c + ': SÓLO iniciales (hasta 4 letras). Nunca un nombre.\nVacío = sin alias.', o.alias || '');
    if (v === null) return;
    const a = v.trim().toUpperCase().replace(/[\s.]/g, '');
    if (a && !ALIAS_RE.test(a)) { alert('Sólo iniciales: hasta 4 letras, sin números ni espacios.'); return; }
    o.alias = a; guardarCodigos();
  }
  function crearPaciente() {                          // devuelve el código nuevo, o null
    const d = diasDesdeLista();
    if (d === null || d > 7) {
      if (!confirm((d === null ? 'Todavía no cargaste la lista de la PC.' : 'La lista de la PC tiene ' + d + ' días.') +
                   '\nSi el otro dispositivo creó un paciente, el código podría repetirse (la PC lo frena).\n\n¿Crear igual?')) return null;
    }
    const c = siguienteLibre();
    if (!confirm('Paciente nuevo: ' + c + '.\nEl nombre real se completa después en la PC.\n\n¿Crear?')) return null;
    const o = { c, alias: '', nuevo: true };
    codigos.push(o); guardarCodigos();
    pedirAlias(o);
    renderCodes(); renderLista();
    return c;
  }
  async function nuevoPaciente() { const c = crearPaciente(); if (c) await tocarChip(c); }
  function agregarExistente() {
    const c = normalizarCodigo($('addexist').value);
    if (!c) { alert('Código inválido: tiene que ser p seguido de números (p012).'); return; }
    if (!obj(c)) { codigos.push({ c, alias: '', nuevo: false }); guardarCodigos(); }
    $('addexist').value = ''; renderCodes(); renderLista();
  }
  async function cargarArchivo(file) {
    if (!file) return;
    const r = parsearLista(await file.text());
    if (!r.codes.length || r.ajenas > 0) {
      alert('Ese archivo no es la lista de códigos de Nemdroid (codigos__rbq_.txt).'); return;
    }
    let nuevos = 0;
    for (const c of r.codes) {
      const o = obj(c);
      if (!o) { codigos.push({ c, alias: '', nuevo: false }); nuevos++; } else o.nuevo = false;
    }
    lista = { generado: r.generado, siguiente: r.siguiente, cargada: new Date().toISOString() };
    guardar(K.lista, lista); guardarCodigos(); renderCodes(); renderLista();
    status('✅ Lista cargada: ' + r.codes.length + ' código(s), ' + nuevos + ' nuevo(s) en este dispositivo.');
  }

  // ---------- hora: el nombre usa siempre la hora de Buenos Aires ----------
  const fmtBA = new Intl.DateTimeFormat('en-CA', { timeZone: BA, year: 'numeric', month: '2-digit', day: '2-digit',
                                                    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  function partesBA(d) { const p = {}; for (const x of fmtBA.formatToParts(d)) p[x.type] = x.value; return p; }
  const stampBA = d => { const p = partesBA(d); return `${p.year}-${p.month}-${p.day}_${p.hour}${p.minute}`; };

      r.append(boton('DETENER Y GUARDAR', 'stop', () => detenerRemota(g)),
               boton('SEGUIR EN ESTA VENTANA', 'warn', () => traerAca(g)),
               boton('paciente', '', () => cambiarDesdeTarjeta(g.cadena)));
      d.append(r, el('div', 'sub', 'Sigue grabando allá. Esta ventana no puede grabar otra cosa al mismo tiempo. ' +
                                   '«Seguir en esta ventana» la pasa acá (la PC une las partes).'));
      box.append(d);
    }
    for (const ps of pend.sort((a, b) => Date.parse(b[0].inicio) - Date.parse(a[0].inicio))) {
      const u = ps[ps.length - 1], c = codigoDe(ps), cortada = !!u.interrumpida;
      const d = el('div', 'card');
      d.innerHTML = '<div class="ct">' + (cortada ? '⚠ SE CORTÓ — NO SE PERDIÓ' : '⚠ SIN GUARDAR') + '</div>' +
        '<div class="cd"><b>' + quien(c) + '</b> · ' + resumen(ps) +
        (cortada ? '<br>Se cortó a las ' + horaBA(finMs(u)) + (u.motivo ? ' (' + esc(u.motivo) + ')' : '') : '') + '</div>';
      const r = el('div', 'row l');
      if (cortada && !u.soloNota) r.append(boton('SEGUIR GRABANDO', 'warn', () => seguir(u.cadena)));
      r.append(boton(c ? 'GUARDAR' : 'ELEGIR PACIENTE Y GUARDAR', 'stop', () => guardarCadena(u.cadena, {})));
      if (c) r.append(boton('paciente', '', () => cambiarDesdeTarjeta(u.cadena)));
      r.append(boton('descartar', 'del', () => descartar(u.cadena)));
      d.append(r);
      if (cortada && !u.soloNota) d.append(el('div', 'sub', '«Seguir grabando» graba la parte ' + ((u.parte || 1) + 1) +
                                                    ' y guarda lo anterior: la PC une las partes en una sola sesión.'));
      box.append(d);
    }
    const otra = vivas.length > 0 && !actual;
    $('recbtn').disabled = otra; $('notabtn').disabled = otra || !!actual;
    if (!actual) $('reclbl').textContent = otra ? 'GRABANDO EN OTRA VENTANA' : 'GRABAR';
    const tg = ps => Math.max(...ps.map(p => Date.parse(p.guardadaEn) || 0));
    hechas.sort((a, b) => tg(b) - tg(a));
    const ult = $('ultimo'); ult.innerHTML = '';
    const top = hechas[0];
    if (top && (top[0].cadena === ultimaGuardada || Date.now() - tg(top) < 2 * 3600e3)) {
      const c = codigoDe(top), c0 = top[0].codigoGuardado;
      const d = el('div', 'card ok');
      d.innerHTML = '<div class="ct">✅ GUARDADA EN DESCARGAS</div><div class="cd"><b>' + quien(c) + '</b> · ' + resumen(top) +
        (c0 && c0 !== c ? '<br>Corregida (era ' + esc(c0) + '): la PC la procesa como ' + esc(c) + '.' : '') +
        '<br><span class="mono">' + top.filter(p => p.nombre).map(p => esc(p.nombre) + '.webm + .json').join('<br>') + '</span></div>';
      const r = el('div', 'row l');
      r.append(boton('CAMBIAR PACIENTE', 'warn', () => cambiarDesdeTarjeta(top[0].cadena)),
               boton('MOVER A NEMDROID', 'stop', () => compartir(top[0].cadena)),
               boton('descargar de nuevo', '', () => redescargar(top[0].cadena)));
      d.append(r);
      ult.append(d);
    }
    const lst = $('rec48l'); lst.innerHTML = '';
    $('rec48').style.display = hechas.length ? '' : 'none';
    $('rec48s').textContent = 'Guardadas en las últimas ' + RETENER_H + ' h (' + hechas.length + ') — siguen también en el teléfono';
    for (const ps of hechas) {
      const c = codigoDe(ps), c0 = ps[0].codigoGuardado;
      const f = el('div', 'fila');
      f.append(el('span', 't', '<b>' + quien(c) + '</b>' + (c0 && c0 !== c ? ' (era ' + esc(c0) + ')' : '') + ' · ' +
                              new Date(Date.parse(ps[0].inicio)).toLocaleDateString('es-AR', { timeZone: BA, day: '2-digit', month: '2-digit' }) +
                              ' ' + resumen(ps)));
      const b1 = el('button'); b1.textContent = 'paciente'; b1.onclick = () => cambiarDesdeTarjeta(ps[0].cadena);
      const b2 = el('button'); b2.textContent = 'descargar'; b2.onclick = () => redescargar(ps[0].cadena);
      const b3 = el('button'); b3.textContent = 'mover'; b3.onclick = () => compartir(ps[0].cadena);
      f.append(b1, b2, b3); lst.append(f);
    }
    pintarVivas();
  }
  function pintarVivas() {
    for (const [id, n] of noticias) {
      const e = $('vivo-' + id);
      if (!e) continue;
      const hace = (Date.now() - n.at) / 1000;
      e.textContent = fmt(n.seg + (n.pausado ? 0 : hace)) + (n.pausado ? ' (en pausa)' : '') +
                      (hace > 8 ? ' · la otra ventana no da noticias hace ' + Math.round(hace) + ' s' : '');
    }
  }

  // ---------- volver a la app / irse ----------
  document.addEventListener('visibilitychange', () => {
    const a = actual;
    if (document.visibilityState === 'hidden') {
      if (a && !a.pausado && !a.terminando) { try { a.rec.requestData(); } catch (e) {} }
    } else {
      if (a) { chequear(a); pedirWakeLock(); }
      render();
    }
  });
  window.addEventListener('pagehide', () => { const a = actual; if (a && !a.terminando) { try { a.rec.requestData(); } catch (e) {} } });
  document.addEventListener('freeze', () => { const a = actual; if (a && !a.terminando) { try { a.rec.requestData(); } catch (e) {} } });
  document.addEventListener('resume', () => { if (actual) chequear(actual); render(); });
  window.addEventListener('beforeunload', e => { if (actual) { e.preventDefault(); e.returnValue = ''; } });

  $('recbtn').onclick = () => { if (!actual) empezar({}); };
  $('notabtn').onclick = () => empezar({ soloNota: true });
  $('pausebtn').onclick = pausar;
  $('stopbtn').onclick = pedirDetener;
  $('negrabtn').onclick = entrarNegra;
  $('nuevo').onclick = nuevoPaciente;
  $('cargar').onclick = () => $('archivo').click();
  $('archivo').onchange = e => { cargarArchivo(e.target.files[0]); e.target.value = ''; };
  $('addbtn').onclick = agregarExistente;
  $('codesearch').addEventListener('input', renderLista);
  $('devbtn').onclick = () => {
    const v = prompt('Nombre corto de este dispositivo (por ejemplo S26 o Tab):', dev.nombre || '');
    if (v === null) return;
    const n = v.trim().slice(0, 12);
    if (n && !/^[A-Za-z0-9 \-]+$/.test(n)) { alert('Sólo letras, números y guiones.'); return; }
    dev.nombre = n; guardar(K.dev, dev); renderLista();
  };

  async function arranque() {
    await abrirDB();
    try { await migrarVieja(); } catch (e) {}
    try { nav.storage && nav.storage.persist && nav.storage.persist(); } catch (e) {}
    try { await purgar(); } catch (e) {}
    await render();
    const pend = $('pendientes').children.length;
    if (pend && !actual) status('⚠ Hay ' + pend + ' grabación(es) arriba que necesitan que hagas algo.');
  }
  if (codigos.length) guardarCodigos();
  renderCodes(); pintarHint(); reloj();
  setInterval(reloj, 20000);
  setInterval(() => { if (document.visibilityState === 'visible') pintarVivas(); }, 1000);
  setInterval(() => { if (!(nav.locks && nav.locks.query) && document.visibilityState === 'visible' && !actual) render(); }, 5000);
  arranque();

  // sólo para pruebas automáticas (no se usa en el teléfono)
  window.__nemdroid = { normalizarCodigo, parsearLista, stampBA, isoBA, esArgentina, siguienteLibre, nombreNuevo, lateral,
                        duracionDe, version: VERSION, todas, trozosDe, render,
                        estado: () => actual ? { id: actual.id, cadena: actual.cadena, parte: actual.parte, code: actual.code,
                                                 rec: actual.rec.state, trozos: actual.i } : null,
                        cortar: () => { const a = actual; if (a && a.track) { try { a.track.stop(); } catch (e) {} a.track.dispatchEvent(new Event('ended')); } },
                        trabar: () => { if (actual) actual.rec.ondataavailable = () => {}; },
                        set codigosPrueba(v) { codigos = v; }, set listaPrueba(v) { lista = v; } };
})();
</script>
</body>
</html>
