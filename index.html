<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F2136">
<title>Nemdroid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Spline+Sans+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0F2136;--panel:#152D47;--accent:#5B9EC9;--ink:#E9F2F9;--muted:#7A93A8;--rec:#E25C6E;--warn:#C9A227}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Archivo',system-ui,sans-serif;
       display:flex;flex-direction:column;
       padding:max(env(safe-area-inset-top),14px) 18px max(env(safe-area-inset-bottom),18px);user-select:none}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:14px}
  header h1{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  header h1 span{font-size:10px;color:var(--muted);letter-spacing:0}
  header .st{font-family:'Spline Sans Mono',monospace;font-size:11px;color:var(--muted)}
  .codes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .chip{border:1px solid #24415F;background:var(--panel);color:var(--ink);
        font-family:'Spline Sans Mono',monospace;font-size:14px;padding:9px 14px;border-radius:9px;cursor:pointer}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#0B1B2C;font-weight:500}
  .chip.edit{color:var(--muted);border-style:dashed}
  .hint{font-size:12px;color:var(--muted);min-height:16px;margin-bottom:6px}
  .panel{display:none;flex-direction:column;gap:8px;border:1px solid #24415F;border-radius:10px;padding:12px;margin-bottom:10px}
  .fld{background:var(--panel);border:1px solid #24415F;color:var(--ink);
       font-family:'Spline Sans Mono',monospace;font-size:14px;padding:10px 12px;border-radius:8px;width:100%}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:20px}
  .ringwrap{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
  svg.ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
  .lvl{fill:none;stroke:var(--accent);stroke-width:3;opacity:.9}
  .base{fill:none;stroke:#24415F;stroke-width:1.5}
  #recbtn{width:158px;height:158px;border-radius:50%;border:none;cursor:pointer;background:var(--panel);color:var(--ink);
          font-family:'Archivo',sans-serif;font-weight:600;font-size:16px;letter-spacing:.06em;
          display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
          box-shadow:0 0 0 1px #24415F,0 10px 30px rgba(0,0,0,.35)}
  #recbtn .dot{width:15px;height:15px;border-radius:50%;background:var(--rec)}
  body.rec #recbtn{background:var(--rec);color:#fff;box-shadow:0 0 0 1px var(--rec),0 10px 34px rgba(226,92,110,.35)}
  body.rec #recbtn .dot{background:#fff;animation:blink 1.2s infinite}
  body.rec .lvl{stroke:var(--rec)}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){body.rec #recbtn .dot{animation:none}}
  #timer{font-family:'Spline Sans Mono',monospace;font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  body:not(.rec) #timer{color:var(--muted)}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn2{border:1px solid #24415F;background:transparent;color:var(--ink);font-family:'Archivo',sans-serif;
        font-weight:600;font-size:13px;letter-spacing:.05em;padding:12px 22px;border-radius:11px;cursor:pointer}
  .btn2:disabled{opacity:.3}
  .btn2.stop{border-color:var(--accent);color:var(--accent)}
  .btn2.warn{border-color:var(--warn);color:var(--warn)}
  footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;min-height:34px;margin-top:12px}
  footer b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Nemdroid <span>v3.3</span></h1>
  <span class="st" id="clock"></span>
</header>

<div id="recovery" class="panel" style="border-color:#C9A227">
  <span id="recmsg" style="font-size:12px;color:#D9C58A"></span>
  <div class="row" style="justify-content:flex-start">
    <button class="btn2 warn" id="recsave">RECUPERAR</button>
    <button class="btn2" id="recdrop">descartar</button>
  </div>
</div>

<div class="codes" id="codes"></div>
<div class="hint" id="hint">Elegí el código del paciente antes de grabar.</div>

<div id="codepanel" class="panel">
  <div style="display:flex;gap:8px">
    <input id="newcode" class="fld" placeholder="nuevo código (p001)" style="flex:1">
    <button class="btn2" id="addcode" style="border-color:#5B9EC9;color:#5B9EC9;padding:10px 18px">+</button>
  </div>
  <input id="codesearch" class="fld" placeholder="buscar…" style="font-family:'Archivo',sans-serif;font-size:13px">
  <div id="codelist" style="max-height:220px;overflow-y:auto"></div>
</div>

<div class="stage">
  <div class="ringwrap">
    <svg class="ring" viewBox="0 0 210 210">
      <circle class="base" cx="105" cy="105" r="98"/>
      <circle class="lvl" id="lvl" cx="105" cy="105" r="84"/>
    </svg>
    <button id="recbtn"><span class="dot"></span><span id="reclbl">GRABAR</span></button>
  </div>
  <div id="timer">00:00</div>
  <div class="row">
    <button class="btn2" id="pausebtn" disabled>Pausar</button>
    <button class="btn2 stop" id="stopbtn" disabled>Detener y guardar</button>
  </div>
  <div id="saverow" class="panel" style="width:100%;max-width:340px">
    <input id="codeinput" class="fld" placeholder="código del paciente">
    <button class="btn2 warn" id="renamebtn">RENOMBRAR Y GUARDAR DE NUEVO</button>
    <button class="btn2" id="sharebtn" style="border-color:#5B9EC9;color:#5B9EC9">MOVER A NEMDROID</button>
  </div>
</div>

<footer id="status">Se guarda en <b>Descargas</b> automáticamente. Después movelo a la carpeta Nemdroid.</footer>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const st = () => $('status');
  window.onerror = (m,s,l) => { if(st()) st().textContent = '⚠ Error: ' + m + ' (línea ' + l + ')'; };
  window.addEventListener('unhandledrejection', e => {
    if(st()) st().textContent = '⚠ Error: ' + ((e.reason && e.reason.message) || e.reason);
  });

  const K = 'rbq_codes';
  let codes = [];
  try { codes = JSON.parse(localStorage.getItem(K) || '["p001","p002","p003"]'); } catch(e){ codes = ['p001']; }
  let sel = null, recording = false, paused = false;
  let rec = null, chunks = [], t0 = 0, tPaused = 0, pauseStart = 0, tick = null;
  let ac = null, analyser = null, raf = null, wakeLock = null;
  let lastBlob = null, lastName = null;

  const saveCodes = () => localStorage.setItem(K, JSON.stringify(codes));

  function renderCodes(){
    const box = $('codes'); box.innerHTML = '';
    codes.slice(0, 12).forEach(c => {
      const b = document.createElement('button');
      b.className = 'chip' + (c === sel ? ' sel' : '');
      b.textContent = c;
      b.onclick = () => {
        if (recording) return;
        sel = c;
        codes = [c, ...codes.filter(x => x !== c)];
        saveCodes(); renderCodes();
        $('hint').textContent = 'Grabando para: ' + c;
      };
      box.appendChild(b);
    });
    const ed = document.createElement('button');
    ed.className = 'chip edit'; ed.textContent = '± códigos';
    ed.onclick = toggleCodePanel;
    box.appendChild(ed);
  }

  function toggleCodePanel(){
    if (recording) return;
    const p = $('codepanel');
    p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    $('newcode').value = '';
    renderCodeList();
  }

  function renderCodeList(){
    const q = ($('codesearch').value || '').trim().toLowerCase();
    const box = $('codelist'); box.innerHTML = '';
    const list = codes.filter(c => !q || c.includes(q));
    list.forEach(c => {
      const row = document.createElement('div');
      row.style.cssText = 'display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:1px solid #1C3550';
      const nm = document.createElement('span');
      nm.textContent = c;
      nm.style.cssText = "flex:1;font-family:'Spline Sans Mono',monospace;font-size:14px";
      nm.onclick = () => { sel = c; codes = [c, ...codes.filter(x=>x!==c)]; saveCodes();
                           renderCodes(); $('hint').textContent = 'Grabando para: ' + c;
                           $('codepanel').style.display = 'none'; };
      const del = document.createElement('button');
      del.textContent = '✕';
      del.style.cssText = 'background:none;border:none;color:#E25C6E;font-size:16px;padding:4px 10px';
      del.onclick = () => { codes = codes.filter(x => x !== c); if (sel === c) sel = null;
                            saveCodes(); renderCodes(); renderCodeList(); };
      row.appendChild(nm); row.appendChild(del); box.appendChild(row);
    });
    if (!list.length) box.innerHTML = '<span style="font-size:12px;color:#7A93A8">Sin resultados.</span>';
  }

  function addCode(){
    const v = ($('newcode').value || '').trim().toLowerCase().replace(/\s+/g, '-');
    if (!/^[a-z0-9\-]{2,24}$/.test(v)){
      $('status').textContent = '⚠ Código inválido (2-24: letras, números, guiones).'; return;
    }
    if (!codes.includes(v)) codes.unshift(v);
    saveCodes(); $('newcode').value = ''; renderCodes(); renderCodeList();
  }

  renderCodes();
  setInterval(() => { $('clock').textContent =
    new Date().toLocaleTimeString('es-AR',{hour:'2-digit',minute:'2-digit'}); }, 1000);

  // ---- persistencia: cada trozo va al almacenamiento del teléfono ----
  const DB='nemdroid', STORE='chunks';
  function db(){ return new Promise((res,rej)=>{ const r=indexedDB.open(DB,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(STORE,{autoIncrement:true});
    r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error); }); }
  async function idbPut(b){ try{ const d=await db();
    d.transaction(STORE,'readwrite').objectStore(STORE).add(b); }catch(e){} }
  async function idbAll(){ try{ const d=await db(); return await new Promise(res=>{
    const r=d.transaction(STORE,'readonly').objectStore(STORE).getAll();
    r.onsuccess=()=>res(r.result||[]); r.onerror=()=>res([]); }); }catch(e){ return []; } }
  async function idbClear(){ try{ const d=await db();
    d.transaction(STORE,'readwrite').objectStore(STORE).clear(); }catch(e){} }

  const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(Math.floor(s%60)).padStart(2,'0');
  function stamp(){ const d=new Date(), p=n=>String(n).padStart(2,'0');
    return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}`; }

  function downloadBlob(blob, name){
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 6000);
  }

  async function checkRecovery(){
    const parts = await idbAll();
    if (!parts.length) return;
    const blob = new Blob(parts, {type:'audio/webm'});
    $('recmsg').textContent = `Hay una grabación sin guardar (${(blob.size/1048576).toFixed(1)} MB). ¿La recuperás?`;
    $('recovery').style.display = 'flex';
    $('recsave').onclick = () => {
      const nm = (prompt('Código para la grabación recuperada:', sel || codes[0] || 'p000') || 'p000')
                   .trim().toLowerCase().replace(/\s+/g,'-');
      lastBlob = blob; lastName = `${nm}__rbq_${stamp()}.webm`;
      downloadBlob(blob, lastName); idbClear();
      $('recovery').style.display = 'none';
      $('saverow').style.display = 'flex';
      $('codeinput').value = nm;
      $('status').innerHTML = '✅ Recuperada y guardada en <b>Descargas</b>: ' + lastName;
    };
    $('recdrop').onclick = () => { idbClear(); $('recovery').style.display = 'none'; };
  }

  async function start(){
    $('status').textContent = 'Iniciando…';
    if (!window.isSecureContext){ $('status').textContent = '⚠ El micrófono requiere HTTPS.'; return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      $('status').textContent = '⚠ Este navegador no soporta grabación.'; return; }
    if (!window.MediaRecorder){ $('status').textContent = '⚠ Sin MediaRecorder.'; return; }
    if (!sel){ $('hint').textContent = '⚠ Elegí primero el código del paciente.'; return; }

    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:true}});
    } catch(e){
      $('status').textContent = '⚠ Micrófono: ' + e.name + (e.name==='NotAllowedError'
        ? ' — permiso denegado.' : e.name==='NotFoundError' ? ' — no se detecta micrófono.' : ' — ' + e.message);
      return;
    }

    try {
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
      rec = new MediaRecorder(stream, mime ? {mimeType:mime, audioBitsPerSecond:96000} : undefined);
      chunks = []; await idbClear();
      rec.ondataavailable = e => { if (e.data.size){ chunks.push(e.data); idbPut(e.data); } };
      rec.onstop = save;
      rec.start(1000);

      ac = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ac.createAnalyser(); analyser.fftSize = 512;
      ac.createMediaStreamSource(stream).connect(analyser);
      const buf = new Uint8Array(analyser.fftSize);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let s=0; for(let i=0;i<buf.length;i++){ const v=(buf[i]-128)/128; s+=v*v; }
        $('lvl').setAttribute('r', 84 + Math.min(14, Math.sqrt(s/buf.length)*130));
        raf = requestAnimationFrame(loop);
      };
      loop();
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch(e){}

      recording = true; paused = false; t0 = Date.now(); tPaused = 0;
      document.body.classList.add('rec');
      $('reclbl').textContent = 'REC';
      $('pausebtn').disabled = false; $('stopbtn').disabled = false;
      $('saverow').style.display = 'none'; $('codepanel').style.display = 'none';
      $('status').innerHTML = 'Grabando <b>' + sel + '</b>. Mejor no cambiar de app.';
      tick = setInterval(() => { if(!paused) $('timer').textContent = fmt((Date.now()-t0-tPaused)/1000); }, 250);
    } catch(e){
      $('status').textContent = '⚠ Error al iniciar: ' + (e.message || e);
      try { stream.getTracks().forEach(t => t.stop()); } catch(_){}
    }
  }

  function pause(){
    if (!recording) return;
    if (!paused){ rec.pause(); paused = true; pauseStart = Date.now(); $('pausebtn').textContent = 'Reanudar'; }
    else { rec.resume(); paused = false; tPaused += Date.now()-pauseStart; $('pausebtn').textContent = 'Pausar'; }
  }

  function stop(){
    if (!recording) return;
    rec.stop();
    rec.stream.getTracks().forEach(t => t.stop());
    cancelAnimationFrame(raf); if (ac) ac.close();
    clearInterval(tick); wakeLock?.release();
    recording = false;
    document.body.classList.remove('rec');
    $('reclbl').textContent = 'GRABAR';
    $('pausebtn').disabled = true; $('pausebtn').textContent = 'Pausar';
    $('stopbtn').disabled = true;
    $('lvl').setAttribute('r', 84);
  }

  function save(){
    const blob = new Blob(chunks, {type:'audio/webm'});
    const name = `${sel}__rbq_${stamp()}.webm`;
    const mins = $('timer').textContent;
    lastBlob = blob; lastName = name;
    downloadBlob(blob, name);
    idbClear();
    $('status').innerHTML = '✅ Guardado en <b>Descargas</b>: ' + name + ' (' + mins + ')';
    $('saverow').style.display = 'flex';
    $('codeinput').value = sel || '';
    $('timer').textContent = '00:00';
  }

  async function shareLast(){
    if (!lastBlob) return;
    const file = new File([lastBlob], lastName, {type:'audio/webm'});
    if (navigator.canShare && navigator.canShare({files:[file]})){
      try { await navigator.share({files:[file], title:lastName}); } catch(e){}
      $('status').innerHTML = 'Si elegiste <b>Mis Archivos → Nemdroid</b>, listo. Si no, sigue en <b>Descargas</b>.';
    } else {
      downloadBlob(lastBlob, lastName);
      $('status').innerHTML = 'Descargado de nuevo: <b>' + lastName + '</b>';
    }
  }

  function renameSave(){
    if (!lastBlob) return;
    const c = ($('codeinput').value || '').trim().toLowerCase().replace(/\s+/g,'-');
    if (!/^[a-z0-9\-]{2,24}$/.test(c)){
      $('status').textContent = '⚠ Código inválido (2-24: letras, números, guiones).'; return; }
    if (!codes.includes(c)){ codes.unshift(c); saveCodes(); renderCodes(); }
    lastName = `${c}__rbq_${stamp()}.webm`;
    downloadBlob(lastBlob, lastName);
    $('status').innerHTML = '✅ Guardado de nuevo como <b>' + lastName + '</b> en Descargas.';
  }

  $('recbtn').onclick = () => { if (!recording) start(); };
  $('pausebtn').onclick = pause;
  $('stopbtn').onclick = () => { if (confirm('¿Detener y guardar la grabación?')) stop(); };
  $('sharebtn').onclick = shareLast;
  $('renamebtn').onclick = renameSave;
  $('addcode').onclick = addCode;
  $('newcode').addEventListener('keydown', e => { if (e.key === 'Enter') addCode(); });
  $('codesearch').addEventListener('input', renderCodeList);

  checkRecovery();
  window.addEventListener('beforeunload', e => { if (recording){ e.preventDefault(); e.returnValue = ''; } });
})();
</script>
</body>
</html>
