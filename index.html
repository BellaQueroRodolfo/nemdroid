<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0F2136">
<title>Nemdroid</title>
<!-- Nemdroid v4.0 — grabadora. Este archivo es público (GitHub Pages): no contiene ni debe
     contener datos de pacientes. Los códigos y alias viven sólo en cada dispositivo. -->
<style>
  :root{--bg:#0F2136;--panel:#152D47;--accent:#5B9EC9;--ink:#E9F2F9;--muted:#7A93A8;--rec:#E25C6E;--warn:#C9A227;--note:#8FBF7A;
        --sans:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;--mono:ui-monospace,"Roboto Mono",Menlo,Consolas,monospace}
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);display:flex;flex-direction:column;
       padding:max(env(safe-area-inset-top),14px) 18px max(env(safe-area-inset-bottom),18px);user-select:none}
  header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:10px}
  header h1{font-size:15px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  header h1 span{font-size:10px;color:var(--muted);letter-spacing:0}
  header .st{font-family:var(--mono);font-size:11px;color:var(--muted);text-align:right}
  .aviso{border:1px solid var(--warn);color:#E6D59B;border-radius:9px;padding:9px 12px;font-size:12px;margin-bottom:10px;line-height:1.5}
  .codes{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
  .chip{border:1px solid #24415F;background:var(--panel);color:var(--ink);font-family:var(--mono);font-size:14px;
        padding:9px 14px;border-radius:9px;cursor:pointer}
  .chip .al{font-family:var(--sans);font-weight:700;margin-right:6px}
  .chip.sel{background:var(--accent);border-color:var(--accent);color:#0B1B2C}
  .chip.edit{color:var(--muted);border-style:dashed}
  .hint{font-size:12px;color:var(--muted);min-height:16px;margin-bottom:6px}
  .panel{display:none;flex-direction:column;gap:8px;border:1px solid #24415F;border-radius:10px;padding:12px;margin-bottom:10px}
  .fld{background:var(--panel);border:1px solid #24415F;color:var(--ink);font-family:var(--mono);font-size:14px;
       padding:10px 12px;border-radius:8px;width:100%}
  .sub{font-size:11px;color:var(--muted);line-height:1.5}
  .rowl{display:flex;gap:8px;flex-wrap:wrap}
  .item{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #1C3550}
  .item .c{font-family:var(--mono);font-size:14px;min-width:46px}
  .item .a{flex:1;font-weight:700;color:var(--accent);font-size:13px}
  .item .nv{font-size:10px;color:var(--warn);border:1px solid var(--warn);border-radius:6px;padding:1px 5px}
  .item button{background:none;border:none;color:var(--muted);font-size:13px;padding:4px 8px;cursor:pointer}
  .item button.del{color:var(--rec);font-size:16px}
  .stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px}
  .ringwrap{position:relative;width:210px;height:210px;display:flex;align-items:center;justify-content:center}
  svg.ring{position:absolute;inset:0;transform:rotate(-90deg);pointer-events:none}
  .lvl{fill:none;stroke:var(--accent);stroke-width:3;opacity:.9}
  .base{fill:none;stroke:#24415F;stroke-width:1.5}
  #recbtn{width:158px;height:158px;border-radius:50%;border:none;cursor:pointer;background:var(--panel);color:var(--ink);
          font-family:var(--sans);font-weight:600;font-size:16px;letter-spacing:.06em;display:flex;flex-direction:column;
          align-items:center;justify-content:center;gap:6px;box-shadow:0 0 0 1px #24415F,0 10px 30px rgba(0,0,0,.35)}
  #recbtn .dot{width:15px;height:15px;border-radius:50%;background:var(--rec)}
  body.rec #recbtn{background:var(--rec);color:#fff;box-shadow:0 0 0 1px var(--rec),0 10px 34px rgba(226,92,110,.35)}
  body.rec.nota #recbtn{background:var(--note);color:#0B1B2C}
  body.rec #recbtn .dot{background:#fff;animation:blink 1.2s infinite}
  body.rec .lvl{stroke:var(--rec)}
  @keyframes blink{50%{opacity:.25}}
  @media (prefers-reduced-motion:reduce){body.rec #recbtn .dot{animation:none}}
  #timer{font-family:var(--mono);font-size:40px;font-variant-numeric:tabular-nums;letter-spacing:.04em}
  body:not(.rec) #timer{color:var(--muted)}
  .row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn2{border:1px solid #24415F;background:transparent;color:var(--ink);font-family:var(--sans);font-weight:600;font-size:13px;
        letter-spacing:.05em;padding:12px 20px;border-radius:11px;cursor:pointer}
  .btn2:disabled{opacity:.3}
  .btn2.stop{border-color:var(--accent);color:var(--accent)}
  .btn2.warn{border-color:var(--warn);color:var(--warn)}
  .btn2.note{border-color:var(--note);color:var(--note)}
  footer{font-size:12px;color:var(--muted);text-align:center;line-height:1.6;min-height:34px;margin-top:12px}
  footer b{color:var(--accent);font-weight:600}
</style>
</head>
<body>
<header>
  <h1>Nemdroid <span>v4.0</span></h1>
  <span class="st" id="clock"></span>
</header>

<div id="tzwarn" class="aviso" style="display:none"></div>
<div id="recovery" class="panel" style="border-color:#C9A227">
  <span id="recmsg" style="font-size:12px;color:#D9C58A"></span>
  <div class="row" style="justify-content:flex-start">
    <button class="btn2 warn" id="recsave">RECUPERAR</button>
    <button class="btn2" id="recdrop">descartar</button>
  </div>
</div>

<div class="codes" id="codes"></div>
<div class="hint" id="hint">Elegí el paciente antes de grabar.</div>

<div id="codepanel" class="panel">
  <div class="rowl">
    <button class="btn2" id="nuevo" style="border-color:#5B9EC9;color:#5B9EC9">+ NUEVO PACIENTE</button>
    <button class="btn2" id="cargar">ACTUALIZAR LISTA</button>
    <input type="file" id="archivo" accept=".txt,text/plain" style="display:none">
  </div>
  <div class="sub" id="listinfo"></div>
  <input id="codesearch" class="fld" placeholder="buscar código o alias…" style="font-family:var(--sans);font-size:13px">
  <div id="codelist" style="max-height:230px;overflow-y:auto"></div>
  <details class="sub"><summary>Agregar a mano un código que ya existe</summary>
    <div class="rowl" style="margin-top:6px"><input id="addexist" class="fld" placeholder="p012" style="flex:1">
    <button class="btn2" id="addbtn">AGREGAR</button></div></details>
  <div class="sub">Alias = iniciales, sólo en este dispositivo. Nunca nombres. · Dispositivo: <b id="devname"></b>
    <button class="btn2" id="devbtn" style="padding:3px 8px;font-size:11px">cambiar</button></div>
</div>

<div class="stage">
  <div class="ringwrap">
    <svg class="ring" viewBox="0 0 210 210"><circle class="base" cx="105" cy="105" r="98"/><circle class="lvl" id="lvl" cx="105" cy="105" r="84"/></svg>
    <button id="recbtn"><span class="dot"></span><span id="reclbl">GRABAR</span></button>
  </div>
  <div id="timer">00:00</div>
  <div class="row">
    <button class="btn2" id="pausebtn" disabled>Pausar</button>
    <button class="btn2 stop" id="stopbtn" disabled>Detener y guardar</button>
  </div>
  <div class="row"><button class="btn2 note" id="notabtn">SÓLO NOTA</button></div>
  <div id="saverow" class="panel" style="width:100%;max-width:340px">
    <button class="btn2" id="sharebtn" style="border-color:#5B9EC9;color:#5B9EC9">MOVER A NEMDROID (audio + datos)</button>
  </div>
</div>

<footer id="status">Cada grabación guarda <b>dos archivos</b> en Descargas (.webm y .json). Mové siempre los dos.</footer>

<script>
(() => {
  'use strict';
  const VERSION = '4.0';
  const BA = 'America/Argentina/Buenos_Aires';
  const K = { codes: 'nem_codes', lista: 'nem_lista', dev: 'nem_dispositivo', usados: 'nem_nombres', orden: 'nem_orden' };
  const CODE_RE = /^p\d{3}$/;
  const ALIAS_RE = /^[A-ZÁÉÍÓÚÑÜ]{1,4}$/;
  const $ = id => document.getElementById(id);
  const status = html => { $('status').innerHTML = html; };
  window.onerror = (m, s, l) => status('⚠ Error: ' + m + ' (línea ' + l + ')');
  window.addEventListener('unhandledrejection', e => status('⚠ Error: ' + ((e.reason && e.reason.message) || e.reason)));

  const leer = (k, def) => { try { const v = JSON.parse(localStorage.getItem(k)); return v === null ? def : v; } catch (e) { return def; } };
  const guardar = (k, v) => localStorage.setItem(k, JSON.stringify(v));
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  // ---------- códigos (sólo códigos y alias de iniciales; nunca nombres) ----------
  function normalizarCodigo(c) {
    const m = String(c || '').trim().toLowerCase().match(/^(?:p|pac)0*(\d{1,3})$/);
    return m ? 'p' + m[1].padStart(3, '0') : null;
  }
  function cargarCodigos() {
    const v = leer(K.codes, null);
    if (Array.isArray(v)) return v.filter(x => x && CODE_RE.test(x.c));
    const out = [];                                   // migración desde v3.3 (rbq_codes)
    for (const c of leer('rbq_codes', [])) {
      const n = normalizarCodigo(c);
      if (n && !out.some(x => x.c === n)) out.push({ c: n, alias: '', nuevo: false });
    }
    return out;
  }
  let codigos = cargarCodigos();
  let lista = leer(K.lista, { generado: null, siguiente: null, cargada: null });
  let orden = leer(K.orden, []);
  let dev = leer(K.dev, null);
  if (!dev || !dev.id) { dev = { id: 'dev-' + Math.random().toString(16).slice(2, 6), nombre: '' }; guardar(K.dev, dev); }
  const guardarCodigos = () => guardar(K.codes, codigos);
  const obj = c => codigos.find(x => x.c === c);
  let sel = null;

  function parsearLista(texto) {
    const res = { codes: [], siguiente: null, generado: null, ajenas: 0 };
    for (const raw of String(texto).split(/\r?\n/)) {
      const l = raw.trim();
      if (!l) continue;
      if (l.startsWith('#')) { const g = l.match(/generado:\s*(.+)$/i); if (g) res.generado = g[1].trim(); continue; }
      const s = l.match(/^siguiente:\s*(p\d{3})$/i);
      if (s) { res.siguiente = s[1].toLowerCase(); continue; }
      const c = normalizarCodigo(l);
      if (c) res.codes.push(c); else res.ajenas++;
    }
    return res;
  }
  function siguienteLibre() {
    let n = 0;
    for (const x of codigos) n = Math.max(n, parseInt(x.c.slice(1), 10));
    n += 1;
    if (lista.siguiente) n = Math.max(n, parseInt(lista.siguiente.slice(1), 10));
    return 'p' + String(n).padStart(3, '0');
  }
  function diasDesdeLista() {
    if (!lista.cargada) return null;
    return Math.floor((Date.now() - Date.parse(lista.cargada)) / 86400000);
  }
  function elegir(c) {
    sel = c;
    orden = [c, ...orden.filter(x => x !== c)].slice(0, 200);
    guardar(K.orden, orden);
    renderCodes();
    const o = obj(c);
    $('hint').textContent = 'Grabando para: ' + (o && o.alias ? o.alias + ' · ' : '') + c + (o && o.nuevo ? ' (paciente nuevo)' : '');
  }
  function etiqueta(o) { return (o.alias ? '<span class="al">' + esc(o.alias) + '</span>' : '') + esc(o.c); }

  function renderCodes() {
    const box = $('codes'); box.innerHTML = '';
    const ordenados = [...codigos].sort((a, b) => {
      const ia = orden.indexOf(a.c), ib = orden.indexOf(b.c);
      return (ia < 0 ? 999 : ia) - (ib < 0 ? 999 : ib) || a.c.localeCompare(b.c);
    });
    ordenados.slice(0, 12).forEach(o => {
      const b = document.createElement('button');
      b.className = 'chip' + (o.c === sel ? ' sel' : '');
      b.innerHTML = etiqueta(o);
      b.onclick = () => { if (!grabando) elegir(o.c); };
      box.appendChild(b);
    });
    const ed = document.createElement('button');
    ed.className = 'chip edit'; ed.textContent = '± pacientes';
    ed.onclick = togglePanel;
    box.appendChild(ed);
  }
  function togglePanel() {
    if (grabando) return;
    const p = $('codepanel');
    p.style.display = (p.style.display === 'flex') ? 'none' : 'flex';
    renderLista();
  }
  function renderLista() {
    const d = diasDesdeLista();
    $('listinfo').textContent = d === null
      ? 'La lista de la PC todavía no se cargó en este dispositivo.'
      : 'Lista de la PC cargada hace ' + (d === 0 ? 'menos de un día' : d + ' día(s)') +
        (lista.siguiente ? ' · próximo código libre según la PC: ' + lista.siguiente : '');
    $('devname').textContent = dev.nombre || dev.id;
    const q = ($('codesearch').value || '').trim().toLowerCase();
    const box = $('codelist'); box.innerHTML = '';
    const filas = codigos.filter(o => !q || o.c.includes(q) || (o.alias || '').toLowerCase().includes(q))
                         .sort((a, b) => a.c.localeCompare(b.c));
    filas.forEach(o => {
      const row = document.createElement('div'); row.className = 'item';
      row.innerHTML = '<span class="c">' + esc(o.c) + '</span><span class="a">' + esc(o.alias || '') + '</span>' +
                      (o.nuevo ? '<span class="nv">nuevo</span>' : '');
      const al = document.createElement('button'); al.textContent = 'alias';
      al.onclick = () => { pedirAlias(o); renderCodes(); renderLista(); };
      const del = document.createElement('button'); del.className = 'del'; del.textContent = '✕';
      del.onclick = () => {
        if (!confirm('¿Sacar ' + o.c + ' de este dispositivo? (No borra nada en la PC.)')) return;
        codigos = codigos.filter(x => x.c !== o.c); if (sel === o.c) sel = null;
        guardarCodigos(); renderCodes(); renderLista();
      };
      const pick = document.createElement('button'); pick.textContent = 'elegir';
      pick.onclick = () => { elegir(o.c); $('codepanel').style.display = 'none'; };
      row.append(al, pick, del); box.appendChild(row);
    });
    if (!filas.length) box.innerHTML = '<span class="sub">Sin pacientes. Tocá ACTUALIZAR LISTA o + NUEVO PACIENTE.</span>';
  }
  function pedirAlias(o) {
    const v = prompt('Alias para ' + o.c + ': SÓLO iniciales (hasta 4 letras). Nunca un nombre.\nVacío = sin alias.', o.alias || '');
    if (v === null) return;
    const a = v.trim().toUpperCase().replace(/[\s.]/g, '');
    if (a && !ALIAS_RE.test(a)) { alert('Sólo iniciales: hasta 4 letras, sin números ni espacios.'); return; }
    o.alias = a; guardarCodigos();
  }
  function nuevoPaciente() {
    const d = diasDesdeLista();
    if (d === null || d > 7) {
      if (!confirm((d === null ? 'Todavía no cargaste la lista de la PC.' : 'La lista de la PC tiene ' + d + ' días.') +
                   '\nSi el otro dispositivo creó un paciente, el código podría repetirse (la PC lo frena).\n\n¿Crear igual?')) return;
    }
    const c = siguienteLibre();
    if (!confirm('Paciente nuevo: ' + c + '.\nEl nombre real se completa después en la PC.\n\n¿Crear?')) return;
    const o = { c, alias: '', nuevo: true };
    codigos.push(o); guardarCodigos();
    pedirAlias(o);
    elegir(c); renderLista();
  }
  function agregarExistente() {
    const c = normalizarCodigo($('addexist').value);
    if (!c) { alert('Código inválido: tiene que ser p seguido de números (p012).'); return; }
    if (!obj(c)) { codigos.push({ c, alias: '', nuevo: false }); guardarCodigos(); }
    $('addexist').value = ''; renderCodes(); renderLista();
  }
  async function cargarArchivo(file) {
    if (!file) return;
    const r = parsearLista(await file.text());
    if (!r.codes.length || r.ajenas > 0) {
      alert('Ese archivo no es la lista de códigos de Nemdroid (codigos__nemdroid.txt).'); return;
    }
    let nuevos = 0;
    for (const c of r.codes) {
      const o = obj(c);
      if (!o) { codigos.push({ c, alias: '', nuevo: false }); nuevos++; } else o.nuevo = false;
    }
    lista = { generado: r.generado, siguiente: r.siguiente, cargada: new Date().toISOString() };
    guardar(K.lista, lista); guardarCodigos(); renderCodes(); renderLista();
    status('✅ Lista cargada: ' + r.codes.length + ' código(s), ' + nuevos + ' nuevo(s) en este dispositivo.');
  }

  // ---------- hora: el nombre usa siempre la hora de Buenos Aires ----------
  const fmtBA = new Intl.DateTimeFormat('en-CA', { timeZone: BA, year: 'numeric', month: '2-digit', day: '2-digit',
                                                    hour: '2-digit', minute: '2-digit', second: '2-digit', hourCycle: 'h23' });
  function partesBA(d) { const p = {}; for (const x of fmtBA.formatToParts(d)) p[x.type] = x.value; return p; }
  const stampBA = d => { const p = partesBA(d); return `${p.year}-${p.month}-${p.day}_${p.hour}${p.minute}`; };
  const isoBA = d => { const p = partesBA(d); return `${p.year}-${p.month}-${p.day}T${p.hour}:${p.minute}:${p.second}-03:00`; };
  const zonaDispositivo = () => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone || 'desconocida'; } catch (e) { return 'desconocida'; } };
  const esArgentina = z => /^America\/(Argentina\/|Buenos_Aires$)/.test(z);
  function nombreNuevo(code, d) {
    const usados = leer(K.usados, []);
    const base = `${code}_${stampBA(d)}`;
    let nombre = base, k = 2;
    while (usados.includes(nombre)) nombre = `${base}-${k++}`;
    usados.push(nombre); guardar(K.usados, usados.slice(-300));
    return nombre;
  }
  function reloj() {
    const z = zonaDispositivo();
    const ba = new Date().toLocaleTimeString('es-AR', { timeZone: BA, hour: '2-digit', minute: '2-digit' });
    $('clock').textContent = esArgentina(z) ? ba : ba + ' BA · ' + z;
  }

  // ---------- persistencia del audio mientras se graba (recuperación) ----------
  const DB = 'nemdroid';
  function db() {
    return new Promise((res, rej) => {
      const r = indexedDB.open(DB, 2);
      r.onupgradeneeded = () => {
        const d = r.result;
        if (!d.objectStoreNames.contains('chunks')) d.createObjectStore('chunks', { autoIncrement: true });
        if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      };
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  }
  async function idb(store, modo, fn) {
    try { const d = await db(); return await new Promise(res => {
      const t = d.transaction(store, modo); const r = fn(t.objectStore(store));
      t.oncomplete = () => res(r && r.result); t.onerror = () => res(null); }); } catch (e) { return null; }
  }
  const idbPut = b => idb('chunks', 'readwrite', s => s.add(b));
  const idbAll = () => idb('chunks', 'readonly', s => s.getAll());
  const idbMeta = m => idb('meta', 'readwrite', s => s.put(m, 'actual'));
  const idbGetMeta = () => idb('meta', 'readonly', s => s.get('actual'));
  async function idbClear() { await idb('chunks', 'readwrite', s => s.clear()); await idb('meta', 'readwrite', s => s.clear()); }

  // ---------- grabación ----------
  let grabando = false, pausado = false, rec = null, chunks = [], t0 = 0, tPausa = 0, inicioPausa = 0, tick = null;
  let ac = null, analyser = null, raf = null, wakeLock = null, sesion = null, ultimo = null;
  const fmt = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(Math.floor(s % 60)).padStart(2, '0');

  function descargar(blob, nombre) {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 8000);
  }
  function lateral(s, fin, segundos) {
    return { formato: 'nemdroid-lateral', version: 1, app: 'nemdroid-pwa ' + VERSION,
             archivo: s.nombre + '.webm', codigo: s.code,
             inicio_ba: isoBA(s.inicio), inicio_utc: s.inicio.toISOString(), fin_utc: fin.toISOString(),
             duracion_grabada_s: Math.round(segundos), pausas_s: Math.round(s.pausasMs / 1000),
             zona_dispositivo: s.zona, dispositivo: dev.nombre || dev.id,
             solo_nota: !!s.soloNota, nuevo_paciente: !!s.nuevo };
  }
  function entregar(blob, s, fin, segundos) {
    const meta = lateral(s, fin, segundos);
    const json = new Blob([JSON.stringify(meta, null, 1)], { type: 'application/json' });
    descargar(blob, s.nombre + '.webm');
    setTimeout(() => descargar(json, s.nombre + '.json'), 800);
    ultimo = { blob, json, nombre: s.nombre };
    const o = obj(s.code); if (o && o.nuevo) { o.nuevo = false; guardarCodigos(); }
    $('saverow').style.display = 'flex';
  }

  async function revisarRecuperacion() {
    const partes = await idbAll() || [];
    if (!partes.length) return;
    const meta = await idbGetMeta();
    const blob = new Blob(partes, { type: 'audio/webm' });
    $('recmsg').textContent = `Hay una grabación sin guardar (${(blob.size / 1048576).toFixed(1)} MB). ¿La recuperás?`;
    $('recovery').style.display = 'flex';
    $('recsave').onclick = async () => {
      let s = meta;
      if (!s) {                                   // grabación de la versión anterior: falta el código
        const c = normalizarCodigo(prompt('Código del paciente de la grabación recuperada (p012):', sel || '') || '');
        if (!c) { alert('Código inválido.'); return; }
        const t = new Date();
        s = { code: c, nombre: nombreNuevo(c, t), inicio: t, zona: zonaDispositivo(), soloNota: false, nuevo: false, pausasMs: 0 };
      }
      s.inicio = new Date(s.inicio);
      const fin = new Date();
      entregar(blob, s, fin, (fin - s.inicio - (s.pausasMs || 0)) / 1000);
      await idbClear();
      $('recovery').style.display = 'none';
      status('✅ Recuperada: <b>' + esc(s.nombre) + '</b> (.webm y .json en Descargas).');
    };
    $('recdrop').onclick = async () => { if (confirm('¿Descartar la grabación sin guardar?')) { await idbClear(); $('recovery').style.display = 'none'; } };
  }

  async function empezar(soloNota) {
    if (grabando) return;
    if (!window.isSecureContext) { status('⚠ El micrófono requiere HTTPS.'); return; }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder) { status('⚠ Este navegador no puede grabar.'); return; }
    if (!sel) { $('hint').textContent = '⚠ Elegí primero el paciente.'; return; }
    if (soloNota && !confirm('SÓLO NOTA (ausencia o nota sin sesión) para ' + sel + '.\n\n¿Cortaste la llamada / salió el paciente?')) return;
    let stream;
    try {
      stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: true } });
    } catch (e) {
      status('⚠ Micrófono: ' + e.name + (e.name === 'NotAllowedError' ? ' — permiso denegado.' : ''));
      return;
    }
    try {
      const t = new Date();
      const zona = zonaDispositivo();
      const o = obj(sel);
      sesion = { code: sel, nombre: nombreNuevo(sel, t), inicio: t, zona, soloNota: !!soloNota, nuevo: !!(o && o.nuevo), pausasMs: 0 };
      await idbClear(); await idbMeta(sesion);
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus' : '';
      rec = new MediaRecorder(stream, mime ? { mimeType: mime, audioBitsPerSecond: 96000 } : undefined);
      chunks = [];
      rec.ondataavailable = e => { if (e.data.size) { chunks.push(e.data); idbPut(e.data); } };
      rec.onstop = guardarGrabacion;
      rec.start(1000);
      ac = new (window.AudioContext || window.webkitAudioContext)();
      analyser = ac.createAnalyser(); analyser.fftSize = 512;
      ac.createMediaStreamSource(stream).connect(analyser);
      const buf = new Uint8Array(analyser.fftSize);
      const loop = () => {
        analyser.getByteTimeDomainData(buf);
        let s = 0; for (let i = 0; i < buf.length; i++) { const v = (buf[i] - 128) / 128; s += v * v; }
        $('lvl').setAttribute('r', 84 + Math.min(14, Math.sqrt(s / buf.length) * 130));
        raf = requestAnimationFrame(loop);
      };
      loop();
      try { wakeLock = await navigator.wakeLock?.request('screen'); } catch (e) {}
      grabando = true; pausado = false; t0 = Date.now(); tPausa = 0;
      document.body.classList.add('rec'); document.body.classList.toggle('nota', !!soloNota);
      $('reclbl').textContent = soloNota ? 'NOTA' : 'REC';
      $('pausebtn').disabled = false; $('stopbtn').disabled = false; $('notabtn').disabled = true;
      $('saverow').style.display = 'none'; $('codepanel').style.display = 'none';
      status((soloNota ? 'Grabando <b>NOTA</b> de ' : 'Grabando <b>') + esc(sel) + (soloNota ? '' : '</b>') + '. Mejor no cambiar de app.');
      if (!esArgentina(zona)) {
        $('tzwarn').style.display = 'block';
        $('tzwarn').textContent = '⚠ Este dispositivo está en otra zona horaria (' + zona +
          '). El archivo se nombra igual con la hora de Buenos Aires; la zona real queda registrada.';
      }
      tick = setInterval(() => { if (!pausado) $('timer').textContent = fmt((Date.now() - t0 - tPausa) / 1000); }, 250);
    } catch (e) {
      status('⚠ Error al iniciar: ' + esc(e.message || e));
      try { stream.getTracks().forEach(x => x.stop()); } catch (_) {}
    }
  }
  function pausar() {
    if (!grabando) return;
    if (!pausado) { rec.pause(); pausado = true; inicioPausa = Date.now(); $('pausebtn').textContent = 'Reanudar'; }
    else { rec.resume(); pausado = false; tPausa += Date.now() - inicioPausa; $('pausebtn').textContent = 'Pausar'; }
  }
  function detener() {
    if (!grabando) return;
    if (pausado) { tPausa += Date.now() - inicioPausa; pausado = false; }
    rec.stop();
    rec.stream.getTracks().forEach(x => x.stop());
    cancelAnimationFrame(raf); if (ac) ac.close();
    clearInterval(tick); wakeLock?.release();
    grabando = false;
    document.body.classList.remove('rec', 'nota');
    $('reclbl').textContent = 'GRABAR';
    $('pausebtn').disabled = true; $('pausebtn').textContent = 'Pausar';
    $('stopbtn').disabled = true; $('notabtn').disabled = false;
    $('lvl').setAttribute('r', 84);
  }
  async function guardarGrabacion() {
    const blob = new Blob(chunks, { type: 'audio/webm' });
    const fin = new Date();
    sesion.pausasMs = tPausa;
    const mins = $('timer').textContent;
    entregar(blob, sesion, fin, (Date.now() - t0 - tPausa) / 1000);
    await idbClear();
    status('✅ Guardado en <b>Descargas</b>: ' + esc(sesion.nombre) + ' (' + mins + ') — .webm y .json. Mové los dos.');
    $('timer').textContent = '00:00';
  }
  async function compartir() {
    if (!ultimo) return;
    const files = [new File([ultimo.blob], ultimo.nombre + '.webm', { type: 'audio/webm' }),
                   new File([ultimo.json], ultimo.nombre + '.json', { type: 'application/json' })];
    if (navigator.canShare && navigator.canShare({ files })) {
      try { await navigator.share({ files, title: ultimo.nombre }); } catch (e) {}
      status('Si elegiste <b>Mis Archivos → Nemdroid</b>, listo (los dos archivos).');
    } else {
      descargar(ultimo.blob, ultimo.nombre + '.webm');
      setTimeout(() => descargar(ultimo.json, ultimo.nombre + '.json'), 800);
      status('Descargados de nuevo: <b>' + esc(ultimo.nombre) + '</b> (.webm y .json).');
    }
  }

  $('recbtn').onclick = () => { if (!grabando) empezar(false); };
  $('notabtn').onclick = () => empezar(true);
  $('pausebtn').onclick = pausar;
  $('stopbtn').onclick = () => { if (confirm('¿Detener y guardar la grabación?')) detener(); };
  $('sharebtn').onclick = compartir;
  $('nuevo').onclick = nuevoPaciente;
  $('cargar').onclick = () => $('archivo').click();
  $('archivo').onchange = e => { cargarArchivo(e.target.files[0]); e.target.value = ''; };
  $('addbtn').onclick = agregarExistente;
  $('codesearch').addEventListener('input', renderLista);
  $('devbtn').onclick = () => {
    const v = prompt('Nombre corto de este dispositivo (por ejemplo S26 o Tab):', dev.nombre || '');
    if (v === null) return;
    const n = v.trim().slice(0, 12);
    if (n && !/^[A-Za-z0-9 \-]+$/.test(n)) { alert('Sólo letras, números y guiones.'); return; }
    dev.nombre = n; guardar(K.dev, dev); renderLista();
  };
  window.addEventListener('beforeunload', e => { if (grabando) { e.preventDefault(); e.returnValue = ''; } });

  if (codigos.length) guardarCodigos();
  renderCodes(); reloj(); setInterval(reloj, 1000 * 20);
  revisarRecuperacion();

  // sólo para pruebas automáticas (no se usa en el teléfono)
  window.__nemdroid = { normalizarCodigo, parsearLista, stampBA, isoBA, esArgentina, siguienteLibre,
                        nombreNuevo, set codigosPrueba(v) { codigos = v; }, set listaPrueba(v) { lista = v; } };
})();
</script>
